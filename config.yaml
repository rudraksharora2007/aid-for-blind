camera:
  index: 0
  width: 1280
  height: 720
  fps: 30
  window_width: 1280
  window_height: 720
model:
  path: yolo11n.pt
  confidence_threshold: 0.45
  iou_threshold: 0.45
  device: auto
speech:
  enabled: true
  cooldown_seconds: 4.0
  repeat_seconds: 12.0
  rate: 165
  volume: 1.0
ocr:
  enabled: true
  languages: [en]
  interval_seconds: 2.5
  cache_seconds: 5.0
  min_text_height: 14
  confidence_threshold: 0.35
distance:
  focal_length_pixels: 700.0
  default_object_height_m: 1.0
  known_object_heights_m:
    person: 1.7
    bicycle: 1.2
    car: 1.5
    bus: 3.0
    motorcycle: 1.2
    dog: 0.5
    cat: 0.3
    chair: 0.9
    backpack: 0.5
    bottle: 0.25
    cup: 0.12
  near_meters: 1.5
  medium_meters: 4.0
tracking:
  max_missing_frames: 12
  iou_threshold: 0.3
logging:
  level: INFO
